name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Check out the pinned upstream contract
        run: |
          git clone https://github.com/oliexdev/openCook.git upstream/opencook
          git -C upstream/opencook checkout a60375d0d73f275ec1f70b687ce89ff389c553d9
      - run: uv venv
      - run: uv pip install -r requirements-test.txt -r requirements-ha-test.txt
      - run: uv run --no-project ruff check custom_components tests scripts addons/opencook/rootfs
      - run: uv run --no-project ruff format --check custom_components tests scripts addons/opencook/rootfs
      - run: uv run --no-project pytest -q

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          comment: false

  container:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: addons/opencook
          platforms: ${{ matrix.platform }}
          load: true
          tags: opencook-test:latest
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Smoke test server, household and persisted storage
        env:
          TEST_PLATFORM: ${{ matrix.platform }}
        run: python scripts/smoke_container.py
