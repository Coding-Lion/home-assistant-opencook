name: openCook Server
version: "0.1.0"
slug: opencook
description: Self-hosted openCook recipe server and household shopping-list sync
url: https://github.com/coding-lion/home-assistant-opencook
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true
host_network: true
webui: http://[HOST]:8000/admin
options:
  server_name: openCook
  admin_password: ""
  vision_base_url: http://127.0.0.1:11434/v1
  vision_model: qwen2.5vl:7b
  vision_api_key: ""
  backup_keep: 14
  log_level: info
schema:
  server_name: str
  admin_password: password
  vision_base_url: url
  vision_model: str
  vision_api_key: password
  backup_keep: int(1,365)
  log_level: list(debug|info|warning|error)
